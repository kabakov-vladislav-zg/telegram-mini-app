server {
    listen 80;
    server_name vladiksfriendsprofilebot.webtm.ru;
    return 301 https://$host$request_uri;
}

server {
    server_name vladiksfriendsprofilebot.webtm.ru;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/vladiksfriendsprofilebot.webtm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vladiksfriendsprofilebot.webtm.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Статические файлы TMA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API endpoints - проксируем на Flask приложение
    location /api/ {
        proxy_pass http://api:5000/api/;  # Имя сервиса в docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers для TMA
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        
        # Обработка preflight запросов
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    # Health check endpoint
    location /health {
        proxy_pass http://api:5000/health;
        proxy_set_header Host $host;
    }
}