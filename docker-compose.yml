version: '3.8'

services:
  bot:
    build: ./bot
    container_name: telegram-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PORT=8080
    restart: unless-stopped
    networks:
      - app-network

  tma:
    build: ./tma
    container_name: tma-app
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - bot
      - tma
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  bot-data: