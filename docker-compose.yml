services:
  bot:
    build: ./bot
    container_name: telegram-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PORT=8080
    restart: unless-stopped

  tma:
    container_name: tma-app
    build: ./tma
    ports:
      - "8080:80"
    environment:
      NODE_ENV: production
    restart: unless-stopped

