services:
  bot:
    build: ./bot
    container_name: telegram-bot
    environment:
      - PYTHONUNBUFFERED=1  # Важно!
      - BOT_TOKEN=${BOT_TOKEN}
    restart: unless-stopped

  tma:
    container_name: tma-app
    build: ./tma
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      NODE_ENV: production
    restart: unless-stopped