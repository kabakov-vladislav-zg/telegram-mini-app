version: '3.8'

services:
  bot:
    build: ./bot
    container_name: telegram-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PORT=8080
    restart: unless-stopped
    networks:
      - app-network

  tma:
    build: ./tma
    container_name: tma-app
    restart: unless-stopped
    networks:
      - app-network
